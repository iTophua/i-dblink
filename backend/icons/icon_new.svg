<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- 背景渐变：深空蓝到暗青色 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#0f2d4a"/>
    </linearGradient>
    
    <!-- 六边形渐变：青色到蓝色 -->
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0066cc"/>
    </linearGradient>
    
    <!-- 数据流渐变：亮青色 -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.1"/>
    </linearGradient>
    
    <!-- 中心发光效果 -->
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.4"/>
      <stop offset="70%" style="stop-color:#0066cc;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:0"/>
    </radialGradient>
    
    <!-- 六边形边框渐变 -->
    <linearGradient id="hexBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff"/>
      <stop offset="100%" style="stop-color:#0088ff"/>
    </linearGradient>
    
    <!-- 发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 强发光滤镜 -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="128" height="128" fill="url(#bgGradient)"/>
  
  <!-- 背景纹理：细微的网格 -->
  <g opacity="0.05">
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#00ffff" stroke-width="0.5"/>
    </pattern>
    <rect x="0" y="0" width="128" height="128" fill="url(#grid)"/>
  </g>

  <!-- 中心发光区域 -->
  <circle cx="64" cy="64" r="40" fill="url(#glowGradient)"/>

  <!-- 六边形网格背景 -->
  <g opacity="0.15" transform="translate(64,64)">
    <!-- 中心六边形 -->
    <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12" 
             fill="none" stroke="url(#hexGradient)" stroke-width="1"/>
    
    <!-- 周围六边形 -->
    <polygon points="0,-48 41.6,-36 41.6,-12 0,0 -41.6,-12 -41.6,-36" 
             fill="none" stroke="url(#hexGradient)" stroke-width="0.8"/>
    <polygon points="0,-48 41.6,-36 41.6,-12 0,0 -41.6,-12 -41.6,-36" 
             fill="none" stroke="url(#hexGradient)" stroke-width="0.8" transform="rotate(60)"/>
    <polygon points="0,-48 41.6,-36 41.6,-12 0,0 -41.6,-12 -41.6,-36" 
             fill="none" stroke="url(#hexGradient)" stroke-width="0.8" transform="rotate(120)"/>
    <polygon points="0,-48 41.6,-36 41.6,-12 0,0 -41.6,-12 -41.6,-36" 
             fill="none" stroke="url(#hexGradient)" stroke-width="0.8" transform="rotate(180)"/>
    <polygon points="0,-48 41.6,-36 41.6,-12 0,0 -41.6,-12 -41.6,-36" 
             fill="none" stroke="url(#hexGradient)" stroke-width="0.8" transform="rotate(240)"/>
    <polygon points="0,-48 41.6,-36 41.6,-12 0,0 -41.6,-12 -41.6,-36" 
             fill="none" stroke="url(#hexGradient)" stroke-width="0.8" transform="rotate(300)"/>
  </g>

  <!-- 中心数据库图标 - 抽象六边形 -->
  <g transform="translate(64,64)" filter="url(#glow)">
    <!-- 主六边形 -->
    <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" 
             fill="none" stroke="url(#hexBorderGradient)" stroke-width="2.5" opacity="0.9"/>
    
    <!-- 内部六边形 -->
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" 
             fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.7"/>
    
    <!-- 中心点 -->
    <circle cx="0" cy="0" r="4" fill="#00ffff" opacity="0.9"/>
    
    <!-- 六边形顶点连接线 -->
    <line x1="0" y1="-18" x2="0" y2="-28" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="15.6" y1="-9" x2="24.2" y2="-14" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="15.6" y1="9" x2="24.2" y2="14" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="18" x2="0" y2="28" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="-15.6" y1="9" x2="-24.2" y2="14" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="-15.6" y1="-9" x2="-24.2" y2="-14" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- 数据流动线条 -->
  <g filter="url(#glow)">
    <!-- 水平流动线 -->
    <path d="M 10,64 Q 32,54 64,64 T 118,64" 
          fill="none" stroke="url(#flowGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 垂直流动线 -->
    <path d="M 64,10 Q 54,32 64,64 T 64,118" 
          fill="none" stroke="url(#flowGradient)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- 对角流动线 -->
    <path d="M 20,20 Q 42,42 64,64 T 108,108" 
          fill="none" stroke="url(#flowGradient)" stroke-width="1" opacity="0.4"/>
    <path d="M 108,20 Q 86,42 64,64 T 20,108" 
          fill="none" stroke="url(#flowGradient)" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 数据节点 - 周围的小六边形 -->
  <g filter="url(#glow)">
    <!-- 上方节点 -->
    <polygon points="64,16 68,18 68,22 64,24 60,22 60,18" 
             fill="#00ffff" opacity="0.8"/>
    
    <!-- 右方节点 -->
    <polygon points="112,64 116,66 116,70 112,72 108,70 108,66" 
             fill="#00ffff" opacity="0.8"/>
    
    <!-- 下方节点 -->
    <polygon points="64,104 68,106 68,110 64,112 60,110 60,106" 
             fill="#00ffff" opacity="0.8"/>
    
    <!-- 左方节点 -->
    <polygon points="16,64 20,66 20,70 16,72 12,70 12,66" 
             fill="#00ffff" opacity="0.8"/>
    
    <!-- 对角节点 -->
    <polygon points="92,32 96,34 96,38 92,40 88,38 88,34" 
             fill="#00ffff" opacity="0.6"/>
    <polygon points="92,88 96,90 96,94 92,96 88,94 88,90" 
             fill="#00ffff" opacity="0.6"/>
    <polygon points="36,32 40,34 40,38 36,40 32,38 32,34" 
             fill="#00ffff" opacity="0.6"/>
    <polygon points="36,88 40,90 40,94 36,96 32,94 32,90" 
             fill="#00ffff" opacity="0.6"/>
  </g>

  <!-- 连接线 - 从中心到节点 -->
  <g stroke="#00ffff" stroke-width="1" opacity="0.4">
    <line x1="64" y1="36" x2="64" y2="16"/>
    <line x1="88" y1="64" x2="112" y2="64"/>
    <line x1="64" y1="92" x2="64" y2="104"/>
    <line x1="40" y1="64" x2="16" y2="64"/>
    <line x1="82" y1="46" x2="92" y2="32"/>
    <line x1="82" y1="82" x2="92" y2="88"/>
    <line x1="46" y1="46" x2="36" y2="32"/>
    <line x1="46" y1="82" x2="36" y2="88"/>
  </g>

  <!-- 装饰性粒子效果 -->
  <g fill="#00ffff">
    <circle cx="20" cy="20" r="1" opacity="0.6"/>
    <circle cx="108" cy="20" r="1" opacity="0.4"/>
    <circle cx="20" cy="108" r="1" opacity="0.4"/>
    <circle cx="108" cy="108" r="1" opacity="0.6"/>
    <circle cx="64" cy="8" r="1.5" opacity="0.8"/>
    <circle cx="120" cy="64" r="1.5" opacity="0.8"/>
    <circle cx="64" cy="120" r="1.5" opacity="0.8"/>
    <circle cx="8" cy="64" r="1.5" opacity="0.8"/>
  </g>

  <!-- 边角装饰 -->
  <g stroke="#00ffff" stroke-width="1" opacity="0.3">
    <!-- 左上角 -->
    <path d="M 4,20 L 4,4 L 20,4"/>
    <!-- 右上角 -->
    <path d="M 108,4 L 124,4 L 124,20"/>
    <!-- 右下角 -->
    <path d="M 124,108 L 124,124 L 108,124"/>
    <!-- 左下角 -->
    <path d="M 20,124 L 4,124 L 4,108"/>
  </g>

  <!-- 应用名称 iDBLink - 简洁现代字体 -->
  <g transform="translate(64,116)" filter="url(#glow)">
    <text x="0" y="0" text-anchor="middle" 
          font-family="'SF Pro Display', 'Segoe UI', 'Roboto', sans-serif" 
          font-size="10" font-weight="600" letter-spacing="2" fill="#00ffff" opacity="0.9">
      IDBLINK
    </text>
  </g>
</svg>