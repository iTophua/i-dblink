name: Test Suite

on:
  push:
    branches: [main, wails]
  pull_request:
    branches: [main, wails]

jobs:
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec -- tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: pnpm test

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      # 只跑纯单元测试包：
      # - main 包用 go:embed frontend/dist，需先 build frontend 才能编译，跳过
      # - backend/api、backend/integration 部分测试需要真实数据库（MySQL/PostgreSQL），跳过
      # 本地开发时可用 `go test ./...` 跑全量（需先 pnpm build 并准备 DB）
      - name: Run Go unit tests
        run: go test ./backend/db/...
